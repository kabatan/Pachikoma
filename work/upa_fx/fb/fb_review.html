<!doctype html><meta charset="utf-8"><title>UPA flipbook review</title>
<style>body{background:#121217;color:#ddd;font:14px monospace;margin:24px}section{display:inline-block;vertical-align:top;margin:8px}canvas{display:block;background:#000;max-width:480px;height:auto}button,input{margin:8px}small{display:block}</style>
<h1>UPA additive flipbooks / 24 fps</h1><p>Offline viewer. Drop fb_manifest.json and the 17 WebP sheets here or select them below. Space: pause. Scrub each sheet to inspect native pixels.</p>
<input type="file" multiple id="files" accept=".json,.webp"><button id="pause">Pause</button><main id="grid"></main>
<script>
let running=true,players=[],tick=0,last=0;
pause.onclick=()=>{running=!running;pause.textContent=running?'Pause':'Play'};
window.onkeydown=e=>{if(e.code==='Space'){e.preventDefault();pause.click()}};
async function load(fs){const map=new Map([...fs].map(f=>[f.name,f]));if(!map.has('fb_manifest.json'))return;const m=JSON.parse(await map.get('fb_manifest.json').text());grid.textContent='';players=[];for(const s of m.sheets){if(!map.has(s.file))continue;const im=await createImageBitmap(map.get(s.file));const box=document.createElement('section'),label=document.createElement('small'),c=document.createElement('canvas'),slider=document.createElement('input');c.width=s.frame_width;c.height=s.frame_height;slider.type='range';slider.min=0;slider.max=s.frame_count-1;slider.value=0;label.textContent=s.id+' / '+s.frame_width+'x'+s.frame_height+' / '+s.frame_count+'f / '+s.fps+'fps';box.append(label,c,slider);grid.append(box);const p={s,im,c,slider,frame:0,hold:false};slider.oninput=()=>{p.frame=+slider.value;p.hold=true;draw(p)};slider.ondblclick=()=>{p.hold=false};players.push(p);draw(p)}}
function draw(p){const {s,im,c,frame}=p;const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(im,(frame%s.cols)*c.width,Math.floor(frame/s.cols)*c.height,c.width,c.height,0,0,c.width,c.height);p.slider.value=frame}
function step(ts){if(ts-last>=1000/24){last=ts;if(running)for(const p of players){if(p.hold)continue;p.frame=(p.frame+1)%(p.s.frame_count+(p.s.loop?0:12));if(p.frame<p.s.frame_count)draw(p)}}requestAnimationFrame(step)}requestAnimationFrame(step);
files.onchange=()=>load(files.files);window.ondragover=e=>e.preventDefault();window.ondrop=e=>{e.preventDefault();load(e.dataTransfer.files)};
</script>
