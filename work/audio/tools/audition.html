<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>通常演出の音 試聴</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; background: #12131a; color: #e8e8f0; margin: 0; padding: 16px; max-width: 760px; }
  h1 { font-size: 18px; } h2 { font-size: 14px; color: #9db; margin: 20px 0 6px; }
  button { font: inherit; padding: 7px 14px; margin: 3px 4px 3px 0; border: 1px solid #556; border-radius: 6px; background: #232638; color: inherit; cursor: pointer; }
  button:hover { background: #343a58; } button.on { background: #285; }
  small { color: #99a; } label { margin-right: 12px; }
</style>
<h1>通常演出の音 試聴</h1>
<p><small>ゲームと同じ合成コード(pachi_synth.mjs)とBGM(bgm/user/normal_loop.ogg)をそのまま鳴らします。音量はスピーカー側で調整してください。</small></p>
<div id="root"></div>
<script>
  if (location.protocol === 'file:') document.getElementById('root').innerHTML = '<p style="color:#fc8;font-size:17px">このページはファイルを直接開くと動きません(ブラウザがモジュールの読み込みを止めます)。<br>リポジトリ直下の <b>Pachikoma-Audition.bat</b> をダブルクリックするか、ゲームを起動した状態で <b>http://127.0.0.1:8800/audio/tools/audition.html</b> を開いてください。</p>';
</script>
<script type="module">
import { synthCues, pachiContact, payoutBuffer } from '../runtime/pachi_synth.mjs';
import { createPocket } from '../runtime/bgm_pocket.mjs';
const ctx = new AudioContext({ sampleRate: 48000 }), root = document.getElementById('root'), cues = synthCues(48000);
const master = ctx.createGain(); master.gain.value = .6; master.connect(ctx.destination);
const stereo = ([L, R]) => { const b = ctx.createBuffer(2, L.length, 48000); b.copyToChannel(L, 0); b.copyToChannel(R, 1); return b; };
const mono = a => { const b = ctx.createBuffer(1, a.length, 48000); b.copyToChannel(a, 0); return b; };
// ゲームと同じ「BGMの中域をSEの間だけあける」処理(通常のSEのみ。4〜6灯・ルーレットはゲームでは全体を5dB下げる)
const pocket = createPocket(ctx), POCKET = new Set(['lamp1', 'lamp2', 'lamp3', 'protect', 'ascend', 'fail', 'ticket', 'add100', 'start', 'warn10']);
pocket.node.connect(master);
function se(k, opts = {}) { const s = play(stereo(cues[k]), opts); if (POCKET.has(k)) pocket.duck(cues[k][0].length / 48000); return s; }
const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 120; hp.connect(master);   // ゲーム内の物理音と同じ高域通過
function play(buf, { loop = false, rate = 1, to = master, gain = 1 } = {}) { const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = buf; s.loop = loop; s.playbackRate.value = rate; g.gain.value = gain; s.connect(g).connect(to); ctx.resume(); s.start(); return s; }
const section = (title) => { const h = document.createElement('h2'); h.textContent = title; root.append(h); };
const btn = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => fn(b); root.append(b); return b; };
const seq = (n, f) => { let i = 0; return () => f(i++ % n); };

section('点灯(1灯→3灯 / 4〜6灯)');
[['点灯1', 'lamp1'], ['点灯2', 'lamp2'], ['点灯3', 'lamp3'], ['4灯', 'lamp4'], ['5灯', 'lamp5'], ['6灯', 'lamp6']].forEach(([t, k]) => btn(t, () => se(k)));
btn('1→6を順に', async () => { for (const k of ['lamp1', 'lamp2', 'lamp3', 'lamp4', 'lamp5', 'lamp6']) { se(k); await new Promise(r => setTimeout(r, k === 'lamp6' ? 0 : 1800)); } });
section('重複・ルーレット・昇格');
btn('重複(保護)', () => se('protect'));
btn('重複 ×2倍速', () => se('protect', { rate: 2 })); btn('重複 ×0.5倍速', () => se('protect', { rate: .5 }));
let roul = null; btn('ルーレット(ループ ON/OFF)', b => { if (roul) { roul.stop(); roul = null; b.classList.remove('on'); } else { roul = play(stereo(cues.roulette_loop), { loop: true }); b.classList.add('on'); } });
btn('昇格', () => se('ascend'));
btn('外れ', () => se('fail'));
section('発射・入賞・開始');
btn('発射', () => play(stereo(cues.launch))); btn('入賞口', () => play(stereo(cues.cup)));
btn('チケット(貸し玉)', () => se('ticket')); btn('追加(100円)', () => se('add100')); btn('スタート', () => se('start'));
btn('残り10秒', () => se('warn10')); btn('皿があふれる', () => play(stereo(cues.overflow)));
section('勝負・当たり・結果・画面(JPは未着手)');
btn('タイトル', () => play(stereo(cues.title))); btn('遊び方', () => play(stereo(cues.howto)));
btn('勝負 宣言', () => play(stereo(cues.declare))); btn('勝負 取消', () => play(stereo(cues.cancel)));
let foc = null; btn('勝負中ループ ON/OFF', b => { if (foc) { foc.stop(); foc = null; b.classList.remove('on'); } else { foc = play(stereo(cues.focus_loop), { loop: true }); b.classList.add('on'); } });
btn('成功(小)', () => play(stereo(cues.success_small))); btn('成功(大)', () => play(stereo(cues.success_big)));
btn('時間切れ', () => play(stereo(cues.timeup)));
let cnt = null; btn('計数中ループ ON/OFF', b => { if (cnt) { cnt.stop(); cnt = null; b.classList.remove('on'); } else { cnt = play(stereo(cues.count_loop), { loop: true }); b.classList.add('on'); } });
btn('結果', () => play(stereo(cues.result)));
section('玉の音(釘・玉どうし・金属・樹脂 / 弱→強)');
for (const m of [['釘(brass)', 'brass'], ['玉どうし(steel)', 'steel'], ['ゲート(metal)', 'metal'], ['樹脂(resin)', 'resin']]) {
  btn(m[0] + ' 弱', () => play(mono(pachiContact({ material: m[1], speed: .4, impulse: .0006, variant: 1 })), { to: hp, gain: .75 }));
  btn(m[0] + ' 中', () => play(mono(pachiContact({ material: m[1], speed: 1.5, impulse: .004, variant: 2 })), { to: hp, gain: .75 }));
  btn(m[0] + ' 強', () => play(mono(pachiContact({ material: m[1], speed: 4, impulse: .02, variant: 3 })), { to: hp, gain: .75 }));
  root.append(document.createElement('br'));
}
btn('釘の連打(盤面を落ちる玉)', async () => { const mats = ['brass', 'brass', 'brass', 'steel', 'brass', 'metal', 'brass', 'brass', 'resin', 'brass']; for (let i = 0; i < 24; i++) { play(mono(pachiContact({ material: mats[i % 10], speed: .5 + (i * 7 % 10) / 4, impulse: .001 + (i % 5) * .002, variant: i })), { to: hp, gain: .75 }); await new Promise(r => setTimeout(r, 45 + (i * 37 % 60))); } });
section('払い出し(受け皿の玉)');
[1, 3, 5, 8].forEach(n => btn(n + '個', () => play(stereo(payoutBuffer(48000, n)), { to: hp, gain: .6 })));
btn('連続(ジャラジャラ)', async () => { for (let i = 0; i < 14; i++) { play(stereo(payoutBuffer(48000, 2 + i % 6)), { to: hp, gain: .6 }); await new Promise(r => setTimeout(r, 130)); } });
section('BGM(パソコン内部で録音した音源。流したまま上のSEを押すと重なりも確認できる)');
const meta = await (await fetch('../bgm/user/normal_loop.json')).json();
const bgm = await ctx.decodeAudioData(await (await fetch('../bgm/user/normal_loop.ogg')).arrayBuffer());
const ls = meta.loop_start_samples / meta.sample_rate, le = meta.loop_end_samples / meta.sample_rate; let bsrc = null;
const startBgm = (offset) => { bsrc?.stop(); bsrc = ctx.createBufferSource(); bsrc.buffer = bgm; bsrc.loop = true; bsrc.loopStart = ls; bsrc.loopEnd = le; bsrc.connect(pocket.node); ctx.resume(); bsrc.start(0, offset); };
btn('最初から', () => startBgm(0)); btn('ループの継ぎ目の8秒前から(つなぎ目を確認)', () => startBgm(le - 8)); btn('停止', () => { bsrc?.stop(); bsrc = null; });
const vol = document.createElement('label'); vol.innerHTML = ' 音量 <input type="range" min="0" max="1" step=".01" value=".6">'; vol.querySelector('input').oninput = e => { master.gain.value = e.target.value; }; root.append(vol);
</script>
