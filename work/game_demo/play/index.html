<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>パチコマ</title><link rel="icon" href="data:,">
<style>
 html,body{margin:0;height:100%;background:#05040f;overflow:hidden}
 #stage{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.777778vw);margin:auto;background:#000}
 #c{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
 #loading{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#05040f;color:#bfc6e8;font:600 clamp(24px,6vw,72px) system-ui,'Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:.2em}
 #start{position:fixed;left:8px;top:8px;z-index:9;padding:6px 12px;font:14px sans-serif;opacity:0;width:1px;height:1px;overflow:hidden}
 .oldui #start,.oldui #fullscreen{opacity:1;width:auto;height:auto}
 #serial-panel{position:fixed;left:8px;top:48px;z-index:9;display:flex;align-items:center;gap:8px;color:#fff;background:#111a;padding:5px 8px;font:12px sans-serif;border-radius:4px}
 #serial-connect{padding:4px 8px;font:12px sans-serif}
 #hud{display:none;position:fixed;right:8px;top:8px;z-index:9;color:#9fd;font:12px monospace;white-space:pre;text-align:right;pointer-events:none}
 #fullscreen{position:fixed;right:8px;bottom:8px;z-index:9;padding:8px 16px;font:16px sans-serif;opacity:0;width:1px;height:1px;overflow:hidden}
 #config-debug{position:fixed;left:8px;bottom:8px;z-index:9;color:#bde;background:#000b;font:12px monospace;white-space:pre-wrap;pointer-events:none;max-width:75vw}
 #config-error{position:fixed;inset:60px 12px auto;z-index:60;padding:16px;background:#300;color:#fff;font:16px sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}
</style></head>
<body>
<button id="start">音を有効にする(クリック)</button>
<div id="serial-panel"><button id="serial-connect">ESP32 接続</button><span id="serial-status">ESP32: 未接続</span></div>
<button id="fullscreen">全画面</button>
<div id="hud"></div>
<div id="config-debug" hidden></div>
<div id="config-error" role="alert" hidden></div>
<div id="stage"><canvas id="c" width="1440" height="2560"></canvas><div id="loading">読み込み中…</div></div>
<script type="module" src="./play.mjs"></script>
</body></html>
