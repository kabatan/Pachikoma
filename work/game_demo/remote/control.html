<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>パチコマ 司令塔</title><link rel="icon" href="data:,">
<style>
:root{--bg:#0b1020;--panel:#161d36;--panel2:#1d2646;--line:#2c3763;--text:#eef1ff;--dim:#9aa6d4;--ok:#2fbf71;--warn:#f2b632;--bad:#e5484d;--accent:#4f8cff;--staff:#ff7a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,'Hiragino Sans','Yu Gothic UI','Noto Sans JP',sans-serif}
body{padding:0 12px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;touch-action:manipulation}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
#link{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--panel);color:var(--dim);white-space:nowrap}
#link.ok{color:#fff;background:#1d6b43}#link.ng{color:#fff;background:#8a2a2e}
button{font:inherit;color:var(--text);border:0;border-radius:14px;min-height:56px;padding:10px 12px;background:var(--panel2);font-weight:700;font-size:17px;cursor:pointer;width:100%}
button:active{filter:brightness(1.3);transform:scale(.985)}
button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:var(--accent)}button.staff{background:var(--staff);color:#1b0d00}button.danger{background:#7b2a35;color:#ffd9dc}
.row{display:grid;gap:8px}.row.two{grid-template-columns:1fr 1fr}.row.three{grid-template-columns:1fr 1fr 1fr}
#login{margin-top:40px;text-align:center}
#login input{font:700 32px/1 ui-monospace,monospace;letter-spacing:.4em;text-align:center;width:100%;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--text);margin:16px 0}
#loginMsg{color:var(--bad);min-height:1.4em;font-weight:700}
#alert{display:none;margin:10px 0 0;padding:12px 14px;border-radius:14px;background:var(--staff);color:#1b0d00;font-weight:800;font-size:18px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.25)}}
section.all{margin:12px 0;padding:12px;background:var(--panel);border-radius:18px}
section.all h2,.card h2{margin:0 0 8px;font-size:15px;color:var(--dim);font-weight:700}
.card{margin:12px 0;padding:14px;background:var(--panel);border-radius:18px;border:2px solid transparent}
.card.waiting{border-color:var(--staff);box-shadow:0 0 0 3px #ff7a1a33}
.card.offline{opacity:.62}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.name{font-size:24px;font-weight:800}
.badge{font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px;background:#33406f;color:#dfe6ff;white-space:nowrap}
.badge.ok{background:#1d6b43;color:#fff}.badge.warn{background:#8a6a12;color:#fff}.badge.off{background:#3a3f55;color:#aab}.badge.bad{background:#8a2a2e;color:#fff}
.phase{font-size:22px;font-weight:800;margin:8px 0 2px}
.phase.staffwait{color:var(--staff)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--dim);font-size:14px;margin-bottom:10px}
.meta b{color:var(--text);font-variant-numeric:tabular-nums}
.paused-tag{display:inline-block;margin-left:8px;font-size:14px;padding:2px 8px;border-radius:8px;background:var(--warn);color:#241a00;vertical-align:middle}
main.down{opacity:.3;pointer-events:none;filter:grayscale(.6)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;max-width:616px;margin:0 auto;padding:14px 16px;border-radius:14px;background:#222c52;border:1px solid var(--line);font-weight:700;display:none;white-space:pre-line}
#toast.ng{background:#5a2229}#toast.ok{background:#17513a}
#modal{position:fixed;inset:0;z-index:30;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}
#modal .box{background:var(--panel);border-radius:20px;padding:20px;width:100%;max-width:420px}
#modal h3{margin:0 0 6px;font-size:22px}#modal p{margin:0 0 16px;color:var(--dim);white-space:pre-line}
</style></head>
<body>
<header><h1>パチコマ 司令塔</h1><span id="link">接続中…</span></header>

<div id="login" hidden>
  <div style="font-size:20px;font-weight:800">暗証番号を入れてください</div>
  <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12" aria-label="暗証番号">
  <div id="loginMsg"></div>
  <button class="primary" id="loginBtn">入る</button>
</div>

<main id="main" hidden>
  <div id="alert" role="alert"></div>
  <section class="all">
    <h2>全台まとめて</h2>
    <div class="row two">
      <button id="allPause">全台 停止</button>
      <button id="allResume" class="primary">全台 再開</button>
    </div>
    <div class="row two" style="margin-top:8px">
      <button id="allStaff" class="staff">チケット受領・再開（待ちの全台）</button>
      <button id="allReset" class="danger">全台 リセット</button>
    </div>
  </section>
  <div id="cards"></div>
</main>

<div id="toast" role="status"></div>
<div id="modal"><div class="box"><h3 id="mTitle"></h3><p id="mBody"></p><div class="row two"><button id="mNo">やめる</button><button id="mYes" class="danger">実行する</button></div></div></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const PIN_KEY = 'pachikoma.remote.pin';
let ws = null, authed = false, snap = null, snapAt = 0, retry = 0, pin = '', toastTimer = null, lastWaiting = '';
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* 保存できなくても動く */ } }, del(k) { try { localStorage.removeItem(k); } catch { /* */ } } };

const PHASE = {
  Attract: '待機中（開始前）', Ready: '遊技中', Flight: '遊技中', Effect: '遊技中', ChainChoice: '遊技中（継続の選択）',
  Continue: '追加の案内中', StaffWait: 'スタッフ待ち', Result: '結果表示（終了）', Fault: '異常（要確認）',
};
const stationName = (id) => /^\d+$/.test(id) ? id + '号機' : id;
function phaseText(s) {
  if (!s) return '—';
  if (s.loading) return '起動中…';
  if (s.error) return '起動エラー';
  if (s.phase === 'Attract' && s.howto) return '説明中';
  if (['Ready', 'Flight', 'Effect'].includes(s.phase) && s.secondsLeft === 0) return '時間切れ（精算中）';
  return PHASE[s.phase] ?? s.phase ?? '—';
}

// ---- 通信 ----
function setLink(text, cls) { const l = $('link'); l.textContent = text; l.className = cls || ''; }
function connect() {
  setLink('司令塔に接続中…', '');
  try { ws = new WebSocket(`ws://${location.host}/ws`); } catch { return later(); }
  const mine = ws;
  mine.onopen = () => { retry = 0; const saved = store.get(PIN_KEY); if (saved) { pin = saved; mine.send(JSON.stringify({ type: 'auth', pin })); } else showLogin(''); };
  mine.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'auth') {
      if (m.ok) { authed = true; $('main').classList.remove('down'); store.set(PIN_KEY, pin); $('login').hidden = true; $('main').hidden = false; setLink('司令塔 つながっている', 'ok'); }
      else { authed = false; store.del(PIN_KEY); showLogin(m.error || '暗証番号が違います'); }
    } else if (m.type === 'snapshot') { snap = m; snapAt = Date.now(); render(); }
    else if (m.type === 'result') showResult(m);
  };
  mine.onclose = () => { if (ws === mine) { ws = null; authed = false; $('main').classList.add('down'); setLink('司令塔と切れています（つなぎ直し中）', 'ng'); later(); } };   // 古い表示は薄くして、押せないようにする
  mine.onerror = () => {};
}
function later() { retry = Math.min(retry + 1, 5); setTimeout(connect, 1000 * retry); }
function showLogin(msg) { $('main').hidden = true; $('login').hidden = false; $('loginMsg').textContent = msg; $('pin').focus(); setLink('暗証番号が必要です', ''); }
function doLogin() { pin = $('pin').value.trim(); if (!pin || !ws || ws.readyState !== 1) return; $('loginMsg').textContent = ''; ws.send(JSON.stringify({ type: 'auth', pin })); $('pin').value = ''; }
$('loginBtn').onclick = doLogin; $('pin').onkeydown = (e) => { if (e.key === 'Enter') doLogin(); };
function send(cmd, targets) {
  if (!ws || ws.readyState !== 1 || !authed) return toast('司令塔と切れています。つながるまで待ってください。', 'ng');
  ws.send(JSON.stringify({ type: 'cmd', cmd, targets }));
  toast('送信しました…', '');
}

// ---- 表示 ----
function toast(text, cls) {
  const t = $('toast'); t.textContent = text; t.className = cls || ''; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, cls === 'ng' ? 6000 : 3500);
}
const CMD_NAME = { reset: 'リセット', pause: '停止', resume: '再開', staff: 'チケット受領・再開', staffcancel: '取消（終了）' };
function showResult(m) {
  if (!m.results) return toast(`${CMD_NAME[m.cmd] ?? m.cmd}: ${m.error || '失敗'}`, 'ng');
  const lines = Object.entries(m.results).map(([id, r]) => `${stationName(id)}: ${r.ok ? '✓ ' : '× '}${r.msg || ''}`);
  toast(`${CMD_NAME[m.cmd] ?? m.cmd}\n${lines.join('\n')}`, m.ok ? 'ok' : 'ng');
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function badge(st) {
  if (!st.online) return ['未接続', 'off'];
  const age = Math.max(0, Math.round((st.ageMs + (Date.now() - snapAt)) / 1000));
  if (st.stale) return [`応答なし ${age}秒`, 'bad'];
  if (st.state?.error) return ['エラー', 'bad'];
  if (st.state?.loading) return ['起動中', 'warn'];
  return ['接続中', 'ok'];
}
function render() {
  if (!snap || !authed) return;
  const cards = $('cards'), stations = snap.stations;
  cards.innerHTML = [...stations].sort((x, y) => (y.online && !y.stale && y.state?.phase === 'StaffWait') - (x.online && !x.stale && x.state?.phase === 'StaffWait')).map((st) => {
    const s = st.state, [btxt, bcls] = badge(st), online = st.online && !st.stale, waiting = online && s?.phase === 'StaffWait';
    const paused = !!s?.paused, can = online && s && !s.loading;
    const meta = [];
    if (online && s && !s.loading) {
      if (['Ready', 'Flight', 'Effect', 'ChainChoice'].includes(s.phase) && s.secondsLeft != null) meta.push(`残り <b>${s.secondsLeft}</b> 秒`);
      if (s.phase === 'Continue' && s.offerLeft != null) meta.push(`案内あと <b>${s.offerLeft}</b> 秒`);
      if (s.phase === 'StaffWait') meta.push(`チケット待ち <b>${s.staffWait ?? 0}</b> 秒`, `受領で <b>+${s.extraSeconds ?? '?'}</b>秒 <b>+${s.extraBalls ?? '?'}</b>玉`);
      if (s.wallet != null) meta.push(`持ち玉 <b>${s.wallet}</b>`);
      if (s.earnings) meta.push(`JP獲得 <b>${s.earnings}</b>`);
      if (s.extraMax != null) meta.push(`追加 <b>${s.extraUsed}</b>/${s.extraMax}回`);
      meta.push(`${s.fps} fps`);
      if (!s.serial) meta.push('筐体ボード 未接続');
      if (s.hidden) meta.push('画面が隠れています');
    }
    return `<div class="card ${waiting ? 'waiting' : ''} ${st.online ? '' : 'offline'}" data-id="${esc(st.id)}">
      <div class="top"><span class="name">${esc(stationName(st.id))}${paused ? '<span class="paused-tag">停止中</span>' : ''}</span><span class="badge ${bcls}">${esc(btxt)}</span></div>
      <div class="phase ${waiting ? 'staffwait' : ''}">${esc(online || (st.online && s) ? phaseText(s) : (st.online ? '状態不明' : 'ゲームがまだつながっていません'))}</div>
      <div class="meta">${meta.join('<span style="opacity:.4">|</span>')}</div>
      <button class="staff" data-act="staff" ${waiting ? '' : 'disabled'} style="margin-bottom:8px;min-height:68px;font-size:20px">チケット受領・再開</button>
      ${waiting ? '<button class="danger" data-act="staffcancel" style="margin-bottom:8px;min-height:44px;font-size:15px">取消（追加しないで終了）</button>' : ''}
      <div class="row two">
        <button data-act="${paused ? 'resume' : 'pause'}" class="${paused ? 'primary' : ''}" ${can ? '' : 'disabled'}>${paused ? '再開' : '停止'}</button>
        <button data-act="reset" class="danger" ${st.online ? '' : 'disabled'}>リセット</button>
      </div></div>`;
  }).join('');
  const waits = stations.filter((st) => st.online && !st.stale && st.state?.phase === 'StaffWait');
  const key = waits.map((st) => st.id).join(',');
  const a = $('alert');
  a.style.display = waits.length ? 'block' : 'none';
  a.textContent = waits.length ? `チケットを受け取ってください: ${waits.map((st) => stationName(st.id) + '（' + (st.state.staffWait ?? 0) + '秒）').join('・')}` : '';
  document.title = waits.length ? `(!) スタッフ待ち ${waits.length}台` : 'パチコマ 司令塔';
  if (key !== lastWaiting) { if (key && (!lastWaiting || key.split(',').some((id) => !lastWaiting.split(',').includes(id)))) { try { navigator.vibrate?.([200, 100, 200]); } catch { /* */ } } lastWaiting = key; }
  const anyOnline = stations.some((st) => st.online);
  $('allPause').disabled = $('allResume').disabled = $('allReset').disabled = !anyOnline;
  $('allStaff').disabled = !waits.length;
}
setInterval(render, 1000);

// ---- 操作（リセットは確認を一段はさむ） ----
function ask(title, body, yes, yesText = '実行する', noText = 'やめる', kind = 'danger') {
  $('mTitle').textContent = title; $('mBody').textContent = body; $('modal').style.display = 'flex';
  $('mYes').textContent = yesText; $('mNo').textContent = noText; $('mYes').className = kind;
  $('mNo').onclick = () => { $('modal').style.display = 'none'; };
  $('mYes').onclick = () => { $('modal').style.display = 'none'; yes(); };
}
function stationLine(ids) { return ids.map(stationName).join('・'); }
$('cards').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]'); if (!b || b.disabled) return;
  const id = b.closest('.card').dataset.id, act = b.dataset.act, name = stationName(id);
  if (act === 'reset') ask(`${name}をリセット`, `${name}のゲームを最初からやり直します。\n遊技中の人がいないか確認してください。`, () => send('reset', [id]));
  else if (act === 'staff') ask(`${name}：チケット受領・再開`, `${name}のお客さまからチケットを1枚受け取りましたか？\n受け取ったら「受領して再開」を押します。押すとすぐ遊技が再開します。`, () => send('staff', [id]), '受領して再開', 'まだ（戻る）', 'staff');   // 押し間違い対策: 一段の確認
  else if (act === 'staffcancel') ask(`${name}：取消`, `${name}は追加をしないで終了にします。\nチケットを受け取っていない／お客さまがやめた場合だけ押します。`, () => send('staffcancel', [id]), '取り消して終了');
  else send(act, [id]);
});
$('allPause').onclick = () => send('pause', 'all');
$('allResume').onclick = () => send('resume', 'all');
$('allReset').onclick = () => {
  const ids = (snap?.stations ?? []).filter((st) => st.online).map((st) => st.id);
  ask('全台リセット', `${stationLine(ids)}を、すべて最初からやり直します。\n遊技中の人がいないか確認してください。`, () => send('reset', 'all'));
};
$('allStaff').onclick = () => {
  const ids = (snap?.stations ?? []).filter((st) => st.online && !st.stale && st.state?.phase === 'StaffWait').map((st) => st.id);
  if (!ids.length) return;
  ask('チケット受領・再開（まとめて）', `${stationLine(ids)}のチケットを、すべて受け取りましたか？`, () => send('staff', ids), '受領して再開', 'まだ（戻る）', 'staff');
};
connect();
</script></body></html>
