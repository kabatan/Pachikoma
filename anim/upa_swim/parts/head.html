<meta charset="utf-8">
<title>ウパの泳ぎ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap">
<style>
/* layout: 横2560x1440の画面を上に、調整スライダーを下に */
:root{--bg:#10243d;--panel:#1b3556;--fg:#eaf3ff;--muted:#9bb6d6;--accent:#ff9ec0;--water:#2f7fd0;color-scheme:dark}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);margin:0;padding-inline:16px;padding-block:12px 24px;font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px}
h1{font-size:16px;margin:0;font-weight:600;align-self:flex-start}
#stage{display:block;width:min(100%,calc(78vh*16/9));aspect-ratio:2560/1440;background:#050a1e;touch-action:manipulation}
#stage canvas{display:block;width:100%;height:100%}
.panel{width:min(100%,520px);background:var(--panel);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:5.5em 1fr 3em;gap:8px 10px;align-items:center}
.panel label{color:var(--muted)}
.panel output{font-variant-numeric:tabular-nums;text-align:right}
.panel input[type=range]{width:100%;min-width:0;accent-color:var(--accent)}
.buttons{display:flex;gap:10px;width:min(100%,520px)}
.buttons button{flex:1;min-height:48px;border:0;border-radius:10px;font:inherit;font-weight:600;background:var(--accent);color:#3a1020;cursor:pointer}
.rlb button{background:#5a0f1c;color:#ffe9e4;font-size:13px}
.buttons button#reset{flex:0 0 auto;padding-inline:20px;background:var(--panel);color:var(--fg)}
.buttons button:disabled{opacity:.45;cursor:default}
.buttons button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.hint{color:var(--muted);font-size:12px;width:min(100%,520px);margin:0}
html.lcd-embed,html.lcd-embed body{width:100%;height:100%;overflow:hidden}
html.lcd-embed body{padding:0;margin:0;gap:0}
html.lcd-embed body>:not(#stage):not(script){display:none!important}
html.lcd-embed #stage{width:100vw;height:100vh;aspect-ratio:auto}
</style>
<h1>ウパの点灯演出</h1>
<div id="stage"></div>
<div class="buttons"><button id="lit" type="button">ランプを点ける</button><button id="reset" type="button">リセット</button></div>
<div class="buttons rlb"><button id="rl_c1" type="button">重複 1〜3灯 −1灯</button><button id="rl_c2" type="button">重複 4灯 −2灯</button><button id="rl_c3" type="button">重複 5灯 全消灯</button></div>
<div class="panel">
  <label for="spd">速さ</label><input id="spd" type="range" min="0.3" max="3" step="0.05" value="1"><output id="spdv"></output>
  <label for="calm">落ち着き</label><input id="calm" type="range" min="0" max="1" step="0.05" value="0.5"><output id="calmv"></output>
  <label for="sz">大きさ</label><input id="sz" type="range" min="3" max="100" step="1" value="16"><output id="szv"></output>
</div>
<p class="hint">ランプを点けるたびに、新しいウパが落ちてきて「N灯」が出ます。1〜3灯は同じ格の夜の演出、4灯は桜色に塗り替わる特別演出、5・6灯はそれより豪華です。7灯は未作成のため6灯で止まります。</p>
