<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590">
<defs><style>
text{font-family:'Yu Gothic','Noto Sans JP',sans-serif;fill:#18293a}.title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.box{fill:#fff;stroke:#344a60;stroke-width:2}.wire{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.usb{stroke:#3879b8}.signal{stroke:#178468}.ground{stroke:#4b5c6e}.note{fill:#fff0cf;stroke:#d3a63a;stroke-width:2}
</style></defs>
<rect width="1100" height="590" fill="#f4f7fb"/>
<text x="40" y="52" class="title">LEDなし・PCのUSB給電だけで使う配線</text>
<text x="40" y="82" class="small">ESP32 DevKit / WROOM-32 ＋ 12V LED付きボタンのスイッチ接点だけを使用</text>

<rect x="42" y="128" width="205" height="108" rx="12" class="box"/>
<text x="65" y="168" class="heading">ゲーム用PC</text><text x="65" y="203" class="label">Chrome / Edge</text>
<rect x="350" y="128" width="280" height="335" rx="12" class="box"/>
<text x="373" y="169" class="heading">ESP32 DevKit</text>
<text x="373" y="217" class="label">USB（給電＋通信）</text>
<text x="373" y="287" class="heading">GPIO25</text>
<text x="373" y="347" class="heading">GPIO26</text>
<text x="373" y="414" class="heading">GND</text>
<path d="M247 190 H350" class="wire usb"/><text x="280" y="178" class="small">USB</text>

<rect x="767" y="225" width="285" height="104" rx="12" class="box"/>
<text x="790" y="262" class="heading">発射ボタンの接点</text>
<text x="790" y="300" class="label">NO　　　　 COM</text>
<rect x="767" y="350" width="285" height="104" rx="12" class="box"/>
<text x="790" y="387" class="heading">勝負ボタンの接点</text>
<text x="790" y="425" class="label">NO　　　　 COM</text>

<path d="M630 280 H744 V293 H767" class="wire signal"/>
<path d="M630 340 H718 V418 H767" class="wire signal"/>
<path d="M630 407 H682 V479 H1007 V454" class="wire ground"/>
<path d="M1007 329 H1070 V479 H1007" class="wire ground"/>
<text x="710" y="501" class="small">両ボタンの COM を GND へ</text>

<rect x="42" y="519" width="1010" height="52" rx="10" class="note"/>
<text x="62" y="541" class="small">LED＋/LED−はどこにも接続せず、端子を個別に絶縁します。12V電源・抵抗・MOSFETは不要です。</text>
<text x="62" y="563" class="small">ESP32の 5V / 3V3 端子も使いません。COM と NO は現物の表示またはテスターで確認してください。</text>
</svg>
