<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040">
<defs><style>
text{font-family:'Yu Gothic','Noto Sans JP',sans-serif;fill:#1a2a3b}.title{font-size:32px;font-weight:700}.heading{font-size:23px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.pin{font-size:19px;font-weight:700}.box{fill:#fff;stroke:#31465d;stroke-width:2}.panel{fill:#fff;stroke:#c3ced9;stroke-width:2}.wire{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.in{stroke:#168569}.power{stroke:#da7a16}.ground{stroke:#43566b}.signal{stroke:#744eb2}.usb{stroke:#3575b4}.warn{fill:#fff0ce;stroke:#d3a73d;stroke-width:2}
</style></defs>
<rect width="1400" height="1040" fill="#f4f7fb"/>
<text x="42" y="50" class="title">パチコマ筐体　ESP32 DevKit / WROOM-32 配線図</text>
<text x="42" y="78" class="small">各LED付きボタンは「スイッチ接点」と「12V LED」を別々に配線します。</text>
<rect x="40" y="105" width="1320" height="300" rx="14" class="panel"/>
<text x="60" y="142" class="heading">① USB・ボタン接点</text>
<rect x="65" y="170" width="215" height="73" rx="10" class="box"/>
<text x="87" y="199" class="pin">ゲーム用PC</text><text x="87" y="226" class="small">Chrome / Edge</text>
<rect x="398" y="170" width="250" height="205" rx="10" class="box"/>
<text x="420" y="202" class="pin">ESP32 DevKit</text>
<text x="420" y="238" class="label">USB</text><text x="420" y="282" class="pin">GPIO25</text><text x="420" y="325" class="pin">GPIO26</text><text x="420" y="361" class="pin">GND</text>
<path d="M280 210 H398" class="wire usb"/><text x="293" y="195" class="small">USB</text>
<rect x="811" y="195" width="222" height="105" rx="10" class="box"/>
<text x="831" y="224" class="pin">発射ボタン 接点</text><text x="832" y="261" class="label">NO　　　 COM</text>
<rect x="1093" y="195" width="237" height="105" rx="10" class="box"/>
<text x="1113" y="224" class="pin">勝負ボタン 接点</text><text x="1114" y="261" class="label">NO　　　 COM</text>
<path d="M648 276 H790 V265 H811" class="wire in"/>
<path d="M648 318 H1070 V265 H1093" class="wire in"/>
<path d="M648 354 H1270 V300" class="wire ground"/>
<path d="M976 300 V354" class="wire ground"/>
<text x="668" y="389" class="small">GPIO25 / GPIO26 は内部プルアップ。押すと NO–COM が GND に接続されます。</text>
<rect x="40" y="430" width="1320" height="510" rx="14" class="panel"/>
<text x="60" y="468" class="heading">② 12V LED（2系統とも同じ回路）</text>
<text x="66" y="501" class="small">USB給電のESP32と12V電源は GND / 0V だけ共通にします。</text>
<rect x="60" y="524" width="610" height="366" rx="12" class="box"/>
<text x="82" y="560" class="heading">発射ボタン LED　Q1: AO3400A</text>
<text x="89" y="606" class="pin">12V電源 +　</text><path d="M244 599 H314" class="wire power"/><text x="328" y="606" class="label">LED＋</text>
<text x="89" y="657" class="pin">LED−</text><path d="M185 650 H259" class="wire power"/><text x="274" y="657" class="label">Q1 Drain (D)</text>
<text x="89" y="708" class="pin">Q1 Source (S)</text><path d="M251 701 H314" class="wire ground"/><text x="329" y="708" class="label">12V電源 0V / GND</text>
<text x="89" y="759" class="pin">GPIO27</text><path d="M199 752 H260" class="wire signal"/><rect x="260" y="733" width="92" height="37" rx="5" class="box"/><text x="270" y="759" class="small">220 Ω</text><path d="M352 752 H395" class="wire signal"/><text x="406" y="759" class="label">Q1 Gate (G)</text>
<path d="M394 752 V808 H438" class="wire ground"/><rect x="438" y="789" width="105" height="37" rx="5" class="box"/><text x="448" y="815" class="small">100 kΩ</text><path d="M543 808 H566" class="wire ground"/><text x="575" y="815" class="label">GND</text>
<text x="89" y="863" class="small">Gate と GND の間に 100 kΩ を接続。</text>
<rect x="730" y="524" width="610" height="366" rx="12" class="box"/>
<text x="752" y="560" class="heading">勝負ボタン LED　Q2: AO3400A</text>
<text x="759" y="606" class="pin">12V電源 +　</text><path d="M914 599 H984" class="wire power"/><text x="998" y="606" class="label">LED＋</text>
<text x="759" y="657" class="pin">LED−</text><path d="M855 650 H929" class="wire power"/><text x="944" y="657" class="label">Q2 Drain (D)</text>
<text x="759" y="708" class="pin">Q2 Source (S)</text><path d="M921 701 H984" class="wire ground"/><text x="999" y="708" class="label">12V電源 0V / GND</text>
<text x="759" y="759" class="pin">GPIO14</text><path d="M869 752 H930" class="wire signal"/><rect x="930" y="733" width="92" height="37" rx="5" class="box"/><text x="940" y="759" class="small">220 Ω</text><path d="M1022 752 H1065" class="wire signal"/><text x="1076" y="759" class="label">Q2 Gate (G)</text>
<path d="M1064 752 V808 H1108" class="wire ground"/><rect x="1108" y="789" width="105" height="37" rx="5" class="box"/><text x="1118" y="815" class="small">100 kΩ</text><path d="M1213 808 H1236" class="wire ground"/><text x="1245" y="815" class="label">GND</text>
<text x="759" y="863" class="small">Gate と GND の間に 100 kΩ を接続。</text>
<rect x="40" y="957" width="1320" height="60" rx="12" class="warn"/>
<text x="60" y="983" class="small">12V を ESP32 の GPIO / 3V3 / 5V に接続しない。ESP32 GND と12V電源 0V は接続する。</text>
<text x="60" y="1007" class="small">実物の COM/NO・LED極性、MOSFETの G/D/S は端子表示とデータシートで確認してください。</text>
</svg>
